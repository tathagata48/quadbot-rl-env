[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quadbot-rl-env"
version = "1.0.0"
description = "A custom 12-DoF quadruped and its Gymnasium environment, trained to walk with PPO"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Tathagata Chowdhury" }]
keywords = [
    "reinforcement-learning", "robotics", "quadruped", "locomotion",
    "mujoco", "gymnasium", "stable-baselines3", "ppo", "legged-robots",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mujoco>=3.2",
    "gymnasium>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Everything needed to train from scratch and reproduce runs/main.
train = [
    "stable-baselines3>=2.4",
    "tensorboard>=2.16",
    "pandas>=2.0",
]
# Plots, HUD rollouts and MP4 export.
viz = [
    "imageio[ffmpeg]>=2.34",
    "matplotlib>=3.8",
]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/tathagata48/quadbot-rl-env"
Issues = "https://github.com/tathagata48/quadbot-rl-env/issues"

[tool.setuptools]
packages = ["quadbot"]

[tool.ruff]
# sim_viewer.py embeds a three.js page as string literals, so line length is
# deliberately not enforced; correctness rules are.
target-version = "py310"
# The Colab notebook is generated by build_notebook.py - lint its source, not it.
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
# zip() over arrays that are equal-length by construction.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# Re-exports for the public API surface.
"quadbot/__init__.py" = ["F401"]
# MUJOCO_GL must be set before mujoco is imported.
"train_run.py" = ["E402"]
"make_video.py" = ["E402"]
"teleop.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
