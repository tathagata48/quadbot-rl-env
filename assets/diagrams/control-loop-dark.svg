 UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e6edf3" text-anchor="start" font-weight="700">MuJoCo</text><text x="752.0" y="110.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#bc8cff" text-anchor="start" font-weight="400">5 × 4 ms = 250 Hz</text><text x="752.0" y="126.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa4b0" text-anchor="start" font-weight="400">contacts, friction, gravity</text><rect x="644.0" y="190.0" width="300.0" height="72.0" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="660.0" y="204.0" width="24.0" height="4.0" rx="2" fill="#c9d1d9" stroke="none" stroke-width="1"/><text x="660.0" y="230.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e6edf3" text-anchor="start" font-weight="700">state</text><text x="660.0" y="248.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa4b0" text-anchor="start" font-weight="400">qpos · qvel · foot contacts</text><rect x="16.0" y="190.0" width="300.0" height="72.0" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="32.0" y="204.0" width="24.0" height="4.0" rx="2" fill="#4ac26b" stroke="none" stroke-width="1"/><text x="32.0" y="230.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e6edf3" text-anchor="start" font-weight="700">observation (48)</text><text x="32.0" y="248.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa4b0" text-anchor="start" font-weight="400">body frame, scaled — the loop closes</text><path d="M840.0 138.0L840.0 184.0" fill="none" stroke="#4d5661" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="840.0,184.0 836.1,178.2 843.9,178.2" fill="#4d5661"