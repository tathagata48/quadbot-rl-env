<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 348" width="960" height="348" role="img" aria-label="The QuadBot control loop: policy at 50 Hz driving PD servos over MuJoCo physics at 250 Hz"><title>The QuadBot control loop: policy at 50 Hz driving PD servos over MuJoCo physics at 250 Hz</title><rect x="0.5" y="0.5" width="959.0" height="347.0" rx="14" fill="#ffffff" stroke="#d0d7de"/><text x="480.0" y="30.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#59636e" text-anchor="middle" font-weight="700" letter-spacing="1.8">ONE CONTROL STEP — 20 ms</text><rect x="16.0" y="52.0" width="208.0" height="86.0" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><rect x="32.0" y="66.0" width="24.0" height="4.0" rx="2" fill="#c4441c" stroke="none" stroke-width="1"/><text x="32.0" y="92.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2328" text-anchor="start" font-weight="700">actor  π(o)</text><text x="32.0" y="110.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#c4441c" text-anchor="start" font-weight="400">48 → 256 → 256 → 128 → 12</text><text x="32.0" y="126.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#59636e" text-anchor="start" font-weight="400">ELU, deterministic at eval</text><path d="M229.0 95.0L245.4 95.0" fill="none" stroke="#9aa4ae" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="251.0,95.0 245.2,98.9 245.2,91.1" fill="#9aa4ae"/><rect x="256.0" y="52.0" width="208.0" height="86.0" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><rect x="272.0" y="66.0" width="24.0" height="4.0" rx="2" fill="#9a6700" stroke="none" stroke-width="1"/><text x="272.0" y="92.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fil